<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomePilot</title>

  <!-- Tailwind (utility classes only, no separate build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM (development builds, UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone: lets app.js use JSX directly in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="#">
</head>
<body>
  <div id="root"></div>

  <!-- App source: plain JSX, transformed in-browser by Babel -->
  <script type="text/babel" data-presets="react" src="app.js"></script>
  <script type="module" src="app.js"></script>
  <script type="text/babel" data-type="module" src="your-script.js"></script>
</body>
</html>
